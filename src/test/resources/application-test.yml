# ═══════════════════════════════════════════════════════════════════════════
# application-test.yml — Configuración para el perfil de tests
#
# Se activa automáticamente con @ActiveProfiles("test") en los tests.
# Usa H2 en memoria en lugar de PostgreSQL para no necesitar una DB real.
# ═══════════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url:      jdbc:h2:mem:tizon_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: test

  jpa:
    hibernate:
      ddl-auto: validate      # El esquema lo crea Flyway, igual que en producción
    show-sql: false

  h2:
    console:
      enabled: false

jwt:
  secret: TestSecretKeyForJUnitTestsOnly32CharsMin!!
  expiration-ms: 3600000   # 1 hora

tizon:
  admin:
    username: admin
    password: admin-test-pass

ia:
  base-url: http://localhost:9999   # IA simulada en tests
  timeout-seconds: 5
  internal-token: test-internal-token

logging:
  level:
    com.tizon: DEBUG