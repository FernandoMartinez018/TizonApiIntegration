# ── Reglas funcionales (GET /api/config) ───────────────────────────────────
tizon:
  severity:
    warning-pct: 10
    critical-pct: 30
  alert-threshold-pct: ${ALERT_THRESHOLD_PCT:30}
  alert-min-frames: 5               # no se generan alertas con menos frames analizados
  frame-interval-ms: 700            # pausa mínima sugerida entre frames
  session-inactivity-minutes: 30    # sesión ACTIVE sin frames → CANCELLED

# ── OpenAPI generado: solo en el perfil dev (application-dev.yaml) ─────────
springdoc:
  api-docs:
    enabled: false
