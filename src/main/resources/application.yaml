spring:
  application:
    name: tizon-api

  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/tizon_db}
    username: ${DB_USER:tizon_user}
    password: ${DB_PASS:}   # obligatorio: sin valor la API no arranca (RequiredDbPasswordCheck)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # Esquema versionado con Flyway (db/migration); Hibernate solo valida (RNF-MAN-01).
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false   # Evita el anti-patrón OSIV
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25

  # ── Jackson (serialización JSON) ───────────────────────────────────────
  jackson:
    property-naming-strategy: SNAKE_CASE   # contrato: JSON en snake_case
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── Servidor ───────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api         # Todos los endpoints bajo /api/...
  compression:
    enabled: true
    mime-types: application/json

# ── Actuator (health, info, métricas) ─────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── JWT ────────────────────────────────────────────────────────────────────
# Sin valor por defecto: JWT_SECRET (≥ 32 bytes) es obligatorio (JwtProperties).
jwt:
  secret:         ${JWT_SECRET:}
  expiration-ms:  ${JWT_EXPIRATION_MS:86400000}   # 24 horas

# ── Servicio de IA (FastAPI, red interna) ─────────────────────────────────
# IA_BASE_URL e INTERNAL_API_TOKEN son obligatorios (IaProperties).
ia:
  base-url:        ${IA_BASE_URL:}
  timeout-seconds: ${IA_TIMEOUT_SECONDS:10}
  internal-token:  ${INTERNAL_API_TOKEN:}

# ── CORS ───────────────────────────────────────────────────────────────────
# Lista separada por comas. Vacío = CORS deshabilitado (la app nativa no lo usa).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

